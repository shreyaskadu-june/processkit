[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processkit"
version = "0.1.0"
description = "Chemical engineering and energy systems design tools: unit operation calculators, thermo properties with units, economics, and PFD generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chemical engineering", "process design", "thermodynamics", "techno-economic analysis", "PFD"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pint>=0.23",
    "CoolProp>=6.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
processkit-pfd = "processkit.pfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
